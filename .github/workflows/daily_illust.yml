name: Daily Illustration Pipeline (03:00 JST)

on:
  schedule:
    # 毎日 日本時間 午前03:00 (UTC 18:00) に自動実行
    - cron: '0 18 * * *'
  workflow_dispatch:
    # GitHubの画面から手動テスト実行

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Japanese Fonts for Signature
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Illustration Pipeline
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || '1Tg4GKLDqiIcbNudSvK8C6Uw_XIqdNNSi6hOZjlifKxY' }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID || '17qo8NbDC_D6Xdbz1b6oo6OxXIIBFaezK' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gemini-2.5-flash-image' }}
          SIGN_LABEL: "#DailySketch"
        run: |
          python daily_illust_main.py

